plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'jacoco'
}

group = 'com.seeloggyplus'
// The project version is now defined in the gradle.properties file.

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

javafx {
    version = '21'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.web']
}

dependencies {
    implementation 'com.jcraft:jsch:0.1.55'
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation("com.github.ben-manes.caffeine:caffeine:3.2.2")
    implementation 'org.xerial:sqlite-jdbc:3.44.1.0'
    implementation 'org.dom4j:dom4j:2.2.0'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.5.19'
    implementation 'commons-io:commons-io:2.14.0'
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'org.controlsfx:controlsfx:11.1.2'
    implementation 'org.fxmisc.richtext:richtextfx:0.11.7'
    implementation 'de.jensd:fontawesomefx-fontawesome:4.7.0-9.1.2'
    implementation 'com.unboundid:unboundid-ldapsdk:7.0.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
    implementation 'io.krakens:java-grok:0.1.9'

    // TestFX Integration Testing
    testImplementation 'org.testfx:testfx-core:4.0.17'
    testImplementation 'org.testfx:testfx-junit5:4.0.17'
    testImplementation 'org.hamcrest:hamcrest:2.2'
    testImplementation 'org.assertj:assertj-core:3.24.2'
    // Headless JavaFX rendering for CI (matches JavaFX 21)
    testRuntimeOnly 'org.testfx:openjfx-monocle:21.0.2'

    // jqwik Property-Based Testing
    testImplementation 'net.jqwik:jqwik:1.9.2'
}

// Generates a version.properties file from the project version
task generateVersionProperties {
    doLast {
        def propsFile = file("$buildDir/resources/main/version.properties")
        propsFile.parentFile.mkdirs()
        propsFile.text = "version=${project.version}"
    }
}
// Ensure the properties file is generated before resources are processed
// Ensure the properties file is generated before resources are processed
processResources.dependsOn generateVersionProperties

test {
    useJUnitPlatform()
    // Keep tests hermetic: never hit the real update endpoint.
    systemProperty 'seeloggyplus.disableUpdateCheck', 'true'

    // Headless JavaFX (Monocle) for CI runners without a display.
    // Enable with: ./gradlew test -PheadlessTest
    if (project.hasProperty('headlessTest')) {
        systemProperty 'testfx.robot', 'glass'
        systemProperty 'testfx.headless', 'true'
        systemProperty 'glass.platform', 'Monocle'
        systemProperty 'monocle.platform', 'Headless'
        systemProperty 'prism.order', 'sw'
        systemProperty 'prism.text', 't2k'
        systemProperty 'java.awt.headless', 'true'
    }

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

application {
    mainClass = 'com.seeloggyplus.Main'
    applicationName = 'SeeloggyPlus'
}

tasks.register('runDev', JavaExec) {
    group = 'application'
    description = 'Runs the SeeLoggyPlus JavaFX Desktop app in Development mode with Hot Reload enabled'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.seeloggyplus.Launcher'
    systemProperty 'seeloggyplus.dev', 'true'
    // Optional local update simulation:
    //   ./gradlew runDev -PupdateManifestUrl=http://localhost:8000/update-manifest.json
    if (project.hasProperty('updateManifestUrl')) {
        systemProperty 'seeloggyplus.updateManifestUrl', project.property('updateManifestUrl')
    }
    if (project.hasProperty('updateChannel')) {
        systemProperty 'seeloggyplus.updateChannel', project.property('updateChannel')
    }
    if (project.hasProperty('installRoot')) {
        systemProperty 'seeloggyplus.installRoot', project.property('installRoot')
    }
}

tasks.register('fatJar', Jar) {
    dependsOn processResources
    archiveClassifier = 'all'
    archiveFileName = "seeloggyplus-all.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': 'com.seeloggyplus.Launcher' }
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}

def detectedPlatform = {
    def os = org.gradle.internal.os.OperatingSystem.current()
    if (os.isWindows()) return 'win'
    if (os.isMacOsX()) return 'mac'
    return 'linux'
}
def buildPlatform = (project.findProperty('platform') ?: detectedPlatform()).toString()
def assetPlatform = buildPlatform == 'win' ? 'windows' : (buildPlatform == 'linux' ? 'linux' : buildPlatform)

tasks.register('packagePortableNoJre', Zip) {
    group = 'distribution'
    description = 'Create platform portable zip without bundled JRE'

    dependsOn 'fatJar'

    archiveFileName = "seeloggyplus-Portable-${buildPlatform}.zip"
    destinationDirectory = file("${buildDir}/distributions")

    into("${project.name}") {
        from(tasks.fatJar.archiveFile) {
            rename { "${project.name}.jar" }
        }
        from('launcher.bat')
        from('launcher.sh')
        from('launcher.properties')
        from('LAUNCHER_README.md')
        from('help') {
            into('help')
        }
    }
}

tasks.register('packagePortableWithJre', Zip) {
    group = 'distribution'
    description = 'Create platform portable zip with bundled JRE (must run on the target OS)'

    dependsOn 'fatJar', 'createCustomJre'

    archiveFileName = "seeloggyplus-Portable-${buildPlatform}-jre.zip"
    destinationDirectory = file("${buildDir}/distributions")

    into("${project.name}") {
        from("${buildDir}/custom-jre") {
            into('jre')
        }
        from(tasks.fatJar.archiveFile) {
            rename { "${project.name}.jar" }
        }
        from('launcher.bat')
        from('launcher.sh')
        from('launcher.properties')
        from('LAUNCHER_README.md')
        from('help') {
            into('help')
        }
    }
}

tasks.register('packagePlatform') {
    group = 'distribution'
    description = 'Build both portable zips (with and without JRE) for the current platform'
    dependsOn 'packagePortableNoJre', 'packagePortableWithJre'
}

// ---------------------------------------------------------------------------
// Update artifacts: per-platform manifest (merged later across platforms)
// ---------------------------------------------------------------------------
tasks.register('generatePlatformManifest', JavaExec) {
    group = 'distribution'
    description = 'Generate update-manifest-<platform>.json listing both platform assets'

    dependsOn 'packagePlatform'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.seeloggyplus.update.ManifestGeneratorCli'

    doFirst {
        def noJre = file("${buildDir}/distributions/seeloggyplus-Portable-${buildPlatform}.zip")
        def withJre = file("${buildDir}/distributions/seeloggyplus-Portable-${buildPlatform}-jre.zip")
        def baseUrl = (project.findProperty('updateBaseUrl')
                ?: "https://github.com/ariefmahendra/seeloggyplus/releases/download/${project.version}").toString()
        def channel = (project.findProperty('updateChannel') ?: 'stable').toString()
        def minSupported = (project.findProperty('minSupported') ?: '').toString()
        def notesUrl = (project.findProperty('releaseNotesUrl') ?: '').toString()
        def out = file("${buildDir}/distributions/update-manifest-${assetPlatform}.json")

        def cliArgs = ['--version', project.version.toString(),
                       '--channel', channel,
                       '--base-url', baseUrl,
                       '--asset', "${assetPlatform}-nojre=${noJre.absolutePath}",
                       '--asset', "${assetPlatform}-jre=${withJre.absolutePath}",
                       '--out', out.absolutePath]
        if (minSupported) {
            cliArgs.addAll(['--min', minSupported])
        }
        if (notesUrl) {
            cliArgs.addAll(['--notes', notesUrl])
        }
        args = cliArgs
    }
}

tasks.register('mergeManifests', JavaExec) {
    group = 'distribution'
    description = 'Merge per-platform manifests into a single update-manifest.json'

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.seeloggyplus.update.ManifestMergeCli'

    doFirst {
        def inputs = fileTree("${buildDir}/distributions") {
            include 'update-manifest-*.json'
        }.files
        def out = file("${buildDir}/distributions/update-manifest.json")
        def cliArgs = ['--out', out.absolutePath]
        inputs.each { cliArgs.addAll(['--in', it.absolutePath]) }
        args = cliArgs
    }
}

tasks.register('buildUpdateArtifacts') {
    group = 'distribution'
    description = 'Build platform zips and the per-platform update manifest'
    dependsOn 'generatePlatformManifest'
}

// ---------------------------------------------------------------------------
// Custom JRE creation using jlink (without JavaFX modules — they're in the fat JAR)
// ---------------------------------------------------------------------------
tasks.register('createCustomJre', Exec) {
    group = 'distribution'
    description = 'Create a minimal custom JRE using jlink'

    def jreOutput = file("${buildDir}/custom-jre")
    def jlinkModules = [
            'java.desktop', 'java.logging', 'java.naming', 'java.sql', 'java.xml',
            'java.net.http',
            'jdk.unsupported', 'java.scripting', 'java.management',
            'jdk.crypto.ec', 'jdk.crypto.cryptoki',
            'jdk.accessibility'
    ].join(',')

    outputs.dir(jreOutput)

    doFirst {
        // Clean previous output so jlink doesn't fail on existing directory
        delete jreOutput
    }

    // Resolve the jlink executable from the Java 21 toolchain
    def javaToolchainService = project.extensions.getByType(JavaToolchainService)
    def launcher = javaToolchainService.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }

    doFirst {
        def javaHome = launcher.get().metadata.installationPath.asFile.absolutePath
        def jlinkExe = org.gradle.internal.os.OperatingSystem.current().isWindows()
                ? "${javaHome}/bin/jlink.exe"
                : "${javaHome}/bin/jlink"

        commandLine jlinkExe,
                '--add-modules', jlinkModules,
                '--strip-debug',
                '--compress', '2',
                '--no-header-files',
                '--no-man-pages',
                '--output', jreOutput.absolutePath
    }
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}