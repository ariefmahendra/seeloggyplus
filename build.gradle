plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.runtime' version '1.13.1'
    id 'jacoco'
}

group = 'com.seeloggyplus'
// The project version is now defined in the gradle.properties file.

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

javafx {
    version = '21'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.web']
}

dependencies {
    implementation 'com.jcraft:jsch:0.1.55'
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation("com.github.ben-manes.caffeine:caffeine:3.2.2")
    implementation 'org.xerial:sqlite-jdbc:3.44.1.0'
    implementation 'org.dom4j:dom4j:2.2.0'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.5.19'
    implementation 'commons-io:commons-io:2.14.0'
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'org.controlsfx:controlsfx:11.1.2'
    implementation 'org.fxmisc.richtext:richtextfx:0.11.7'
    implementation 'de.jensd:fontawesomefx-fontawesome:4.7.0-9.1.2'
    implementation 'com.unboundid:unboundid-ldapsdk:7.0.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    implementation 'io.krakens:java-grok:0.1.9'

    // TestFX Integration Testing
    testImplementation 'org.testfx:testfx-core:4.0.17'
    testImplementation 'org.testfx:testfx-junit5:4.0.17'
    testImplementation 'org.hamcrest:hamcrest:2.2'
    testImplementation 'org.assertj:assertj-core:3.24.2'
}

// Generates a version.properties file from the project version
task generateVersionProperties {
    doLast {
        def propsFile = file("$buildDir/resources/main/version.properties")
        propsFile.parentFile.mkdirs()
        propsFile.text = "version=${project.version}"
    }
}
// Ensure the properties file is generated before resources are processed
// Ensure the properties file is generated before resources are processed
processResources.dependsOn generateVersionProperties

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

application {
    mainClass = 'com.seeloggyplus.Main'
    applicationName = 'SeeloggyPlus'
}

runtime {
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
    modules = [
            'java.desktop', 'java.logging', 'java.naming', 'java.sql', 'java.xml',
            'jdk.unsupported', 'java.scripting', 'java.management',
            'jdk.crypto.ec', 'jdk.crypto.cryptoki',
            'javafx.controls', 'javafx.fxml', 'javafx.web', 'javafx.graphics'
    ]
}

tasks.register('fatJar', Jar) {
    archiveClassifier = 'all'
    archiveFileName = "seeloggyplus-all.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': 'com.seeloggyplus.Launcher' }
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}

tasks.register('createPortableDist', Zip) {
    group = 'distribution'
    description = 'create zip portable distribution without bundled JRE'

    dependsOn 'fatJar'

    archiveFileName = "${project.name}-Portable.zip"
    destinationDirectory = file("${buildDir}/distributions")

    into("${project.name}") {
        from(tasks.fatJar.archiveFile) {
            rename { "${project.name}.jar" }
        }

        // Add launcher scripts for custom memory configuration
        from('launcher.bat')
        from('launcher.sh')
        from('launcher.properties')
        from('LAUNCHER_README.md')
    }
}

runtime {
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
    modules = [
            'java.desktop', 'java.logging', 'java.naming', 'java.sql', 'java.xml',
            'jdk.unsupported', 'java.scripting', 'java.management',
            'jdk.crypto.ec', 'jdk.crypto.cryptoki',
            'javafx.controls', 'javafx.fxml', 'javafx.web', 'javafx.graphics'
    ]
    
    jpackage {
        installerType = 'msi'
        appVersion = project.version
        imageName = 'SeeLoggyPlus'
        skipInstaller = false
        if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
             installerOptions = ['--win-menu', '--win-shortcut', '--win-dir-chooser']
        }
    }
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}