plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'jacoco'
}

group = 'com.seeloggyplus'
// The project version is now defined in the gradle.properties file.

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

javafx {
    version = '21'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.web']
}

dependencies {
    // mwiede/jsch is a drop-in fork of JSch that supports modern keys
    // (ed25519, ecdsa, rsa-sha2) which the original 0.1.55 does not.
    implementation 'com.github.mwiede:jsch:0.2.20'
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation("com.github.ben-manes.caffeine:caffeine:3.2.2")
    implementation 'org.xerial:sqlite-jdbc:3.44.1.0'
    implementation 'org.dom4j:dom4j:2.2.0'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.5.19'
    implementation 'commons-io:commons-io:2.14.0'
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'org.controlsfx:controlsfx:11.1.2'
    implementation 'org.fxmisc.richtext:richtextfx:0.11.7'
    implementation 'de.jensd:fontawesomefx-fontawesome:4.7.0-9.1.2'
    implementation 'com.unboundid:unboundid-ldapsdk:7.0.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
    implementation 'io.krakens:java-grok:0.1.9'

    // TestFX Integration Testing
    testImplementation 'org.testfx:testfx-core:4.0.17'
    testImplementation 'org.testfx:testfx-junit5:4.0.17'
    testImplementation 'org.hamcrest:hamcrest:2.2'
    testImplementation 'org.assertj:assertj-core:3.24.2'
    // Headless JavaFX rendering for CI (matches JavaFX 21)
    testRuntimeOnly 'org.testfx:openjfx-monocle:21.0.2'

    // jqwik Property-Based Testing
    testImplementation 'net.jqwik:jqwik:1.9.2'
}

// Generates a version.properties file from the project version.
//
// The file is written to a dedicated generated-resources directory (NOT directly
// into processResources' output dir) and that directory is registered as an extra
// resource source. Declaring `version` as an input and the directory as an output
// makes the generation cache-correct: Gradle's up-to-date checks / build cache can
// no longer restore a stale processResources output that drops version.properties,
// which previously made released builds fall back to the "DEV" version.
def generatedVersionResources = "$buildDir/generated/version-resources"

def generateVersionProperties = tasks.register('generateVersionProperties') {
    inputs.property('version', project.version.toString())
    inputs.dir('docs/release-notes')
    outputs.dir(generatedVersionResources)
    doLast {
        def propsFile = file("${generatedVersionResources}/version.properties")
        propsFile.parentFile.mkdirs()
        propsFile.text = "version=${project.version}"

        // Embed the release notes of this version so the app can show a
        // "What's New" dialog after an update, without network access.
        def notesFile = file("docs/release-notes/${project.version}.md")
        def notesTarget = file("${generatedVersionResources}/release-notes.md")
        notesTarget.setText(notesFile.exists() ? notesFile.getText('UTF-8') : '', 'UTF-8')
    }
}
// Ensure the properties file is generated before resources are processed
processResources.dependsOn generateVersionProperties
sourceSets.main.resources.srcDir(generatedVersionResources)

// A native animated splash appears before Main/JavaFX are loaded, including javaw
// launches through the VBS shortcut. Keep the GIF inside the JAR so existing
// installers and blue/green update layouts need no extra package entries.
def generatedSplashResources = layout.buildDirectory.dir('generated/splash-resources')
def generateStartupSplash = tasks.register('generateStartupSplash') {
    inputs.file('src/main/resources/style/theme.css')
    inputs.file('src/main/resources/images/app-icon.png')
    inputs.property('version', project.version.toString())
    outputs.dir(generatedSplashResources)
    doLast {
        // Remove assets from earlier generator versions, including the static PNG.
        delete generatedSplashResources
        def css = file('src/main/resources/style/theme.css').getText('UTF-8')
        def color = { String token ->
            def match = css =~ /${java.util.regex.Pattern.quote(token)}\s*:\s*(#[0-9a-fA-F]{6})/
            if (!match.find()) throw new GradleException("Missing splash theme token: ${token}")
            java.awt.Color.decode(match.group(1))
        }
        def image = new java.awt.image.BufferedImage(480, 230, java.awt.image.BufferedImage.TYPE_INT_RGB)
        def graphics = image.createGraphics()
        try {
            graphics.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
            graphics.setRenderingHint(java.awt.RenderingHints.KEY_TEXT_ANTIALIASING, java.awt.RenderingHints.VALUE_TEXT_ANTIALIAS_ON)
            graphics.setColor(color('-sl-chrome'))
            graphics.fillRect(0, 0, image.width, image.height)
            graphics.setColor(color('-sl-accent-text'))
            graphics.fillRect(0, 0, image.width, 3)
            def icon = javax.imageio.ImageIO.read(file('src/main/resources/images/app-icon.png'))
            graphics.drawImage(icon, 32, 32, 64, 64, null)
            graphics.setColor(color('-sl-chrome-text'))
            graphics.setFont(new java.awt.Font('Segoe UI', java.awt.Font.BOLD, 30))
            graphics.drawString('SeeLoggyPlus', 120, 64)
            graphics.setFont(new java.awt.Font('Segoe UI', java.awt.Font.PLAIN, 13))
            graphics.drawString('A Fast, Modern & Intelligent Log Viewer', 120, 87)
            graphics.setFont(new java.awt.Font('Segoe UI', java.awt.Font.BOLD, 15))
            graphics.drawString('Starting SeeLoggyPlus...', 32, 145)
            graphics.setFont(new java.awt.Font('Segoe UI', java.awt.Font.PLAIN, 13))
            graphics.drawString('Starting Java...', 32, 171)
            graphics.setColor(color('-sl-chrome-text-muted'))
            graphics.setFont(new java.awt.Font('Segoe UI', java.awt.Font.PLAIN, 11))
            graphics.drawString("v${project.version}".toString(), 32, 212)
            graphics.setColor(color('-sl-chrome-hover'))
            graphics.fillRoundRect(32, 185, 416, 6, 6, 6)
            graphics.setColor(color('-sl-accent-text'))
            graphics.fillRoundRect(32, 185, 96, 6, 6, 6)
        } finally {
            graphics.dispose()
        }
        // GIF palette quantization can shift even flat token colours by a channel
        // value. Derive one adaptive palette, then preserve the exact theme tokens
        // for every frame and for the opaque runtime status overlay.
        def paletteBytes = new java.io.ByteArrayOutputStream()
        javax.imageio.ImageIO.write(image, 'gif', paletteBytes)
        def indexed = javax.imageio.ImageIO.read(new java.io.ByteArrayInputStream(paletteBytes.toByteArray()))
        def model = indexed.getColorModel()
        byte[] reds = new byte[model.mapSize], greens = new byte[model.mapSize], blues = new byte[model.mapSize]
        model.getReds(reds)
        model.getGreens(greens)
        model.getBlues(blues)
        ['-sl-chrome', '-sl-chrome-text', '-sl-chrome-text-muted', '-sl-chrome-hover', '-sl-accent-text'].each { token ->
            def value = color(token)
            int nearest = (0..<model.mapSize).min { int index ->
                int r = (reds[index] & 0xff) - value.red
                int g = (greens[index] & 0xff) - value.green
                int b = (blues[index] & 0xff) - value.blue
                r * r + g * g + b * b
            }
            reds[nearest] = (byte) value.red
            greens[nearest] = (byte) value.green
            blues[nearest] = (byte) value.blue
        }
        def gifPalette = new java.awt.image.IndexColorModel(8, model.mapSize, reds, greens, blues)
        def target = generatedSplashResources.get().file('images/startup-splash.gif').asFile
        target.parentFile.mkdirs()
        def writer = javax.imageio.ImageIO.getImageWritersByFormatName('gif').next()
        def output = javax.imageio.ImageIO.createImageOutputStream(target)
        def paletteIndexes = new HashMap<Integer, Byte>()
        try {
            writer.setOutput(output)
            writer.prepareWriteSequence(null)
            // Native GIF playback continues even while FXMLLoader occupies the FX
            // thread. One 1.2-second loop, without an application animation thread.
            int frames = 24
            for (int i = 0; i < frames; i++) {
                def rendered = new java.awt.image.BufferedImage(480, 230, java.awt.image.BufferedImage.TYPE_INT_RGB)
                def frameGraphics = rendered.createGraphics()
                try {
                    frameGraphics.drawImage(image, 0, 0, null)
                    frameGraphics.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
                    frameGraphics.setColor(color('-sl-chrome'))
                    frameGraphics.fillRect(32, 184, 416, 9)
                    frameGraphics.setColor(color('-sl-chrome-hover'))
                    frameGraphics.fillRoundRect(32, 185, 416, 6, 6, 6)
                    int position = 32 + Math.round(320 * (1 - Math.cos(2 * Math.PI * i / frames)) / 2)
                    frameGraphics.setColor(color('-sl-accent-text'))
                    frameGraphics.fillRoundRect(position, 185, 96, 6, 6, 6)
                } finally {
                    frameGraphics.dispose()
                }
                // Explicit palette lookup avoids Java2D's indexed-image dithering
                // and keeps both flat colours and antialiased edges consistent.
                def frame = new java.awt.image.BufferedImage(480, 230, java.awt.image.BufferedImage.TYPE_BYTE_INDEXED, gifPalette)
                int[] pixels = rendered.getRGB(0, 0, 480, 230, null, 0, 480)
                byte[] indexes = new byte[pixels.length]
                for (int pixel = 0; pixel < pixels.length; pixel++) {
                    int rgb = pixels[pixel]
                    Byte index = paletteIndexes.get(rgb)
                    if (index == null) {
                        index = ((byte[]) gifPalette.getDataElements(rgb, null))[0]
                        paletteIndexes.put(rgb, index)
                    }
                    indexes[pixel] = index
                }
                frame.raster.setDataElements(0, 0, 480, 230, indexes)
                def metadata = writer.getDefaultImageMetadata(javax.imageio.ImageTypeSpecifier.createFromRenderedImage(frame), null)
                def tree = metadata.getAsTree('javax_imageio_gif_image_1.0')
                def control = tree.getElementsByTagName('GraphicControlExtension').item(0)
                // Supply the palette explicitly: default GIF metadata may contain
                // the web palette rather than the image's custom indexed colours.
                def table = tree.getElementsByTagName('LocalColorTable').item(0)
                if (table == null) {
                    table = new javax.imageio.metadata.IIOMetadataNode('LocalColorTable')
                    tree.insertBefore(table, control)
                }
                while (table.hasChildNodes()) table.removeChild(table.firstChild)
                table.setAttribute('sizeOfLocalColorTable', model.mapSize.toString())
                table.setAttribute('sortFlag', 'FALSE')
                for (int index = 0; index < model.mapSize; index++) {
                    def entry = new javax.imageio.metadata.IIOMetadataNode('ColorTableEntry')
                    entry.setAttribute('index', index.toString())
                    entry.setAttribute('red', (reds[index] & 0xff).toString())
                    entry.setAttribute('green', (greens[index] & 0xff).toString())
                    entry.setAttribute('blue', (blues[index] & 0xff).toString())
                    table.appendChild(entry)
                }
                control.setAttribute('disposalMethod', 'none')
                control.setAttribute('delayTime', '5') // GIF delays are hundredths of a second.
                if (i == 0) {
                    def extensions = new javax.imageio.metadata.IIOMetadataNode('ApplicationExtensions')
                    def loop = new javax.imageio.metadata.IIOMetadataNode('ApplicationExtension')
                    loop.setAttribute('applicationID', 'NETSCAPE')
                    loop.setAttribute('authenticationCode', '2.0')
                    loop.setUserObject([1, 0, 0] as byte[]) // Repeat until the main window appears.
                    extensions.appendChild(loop)
                    tree.appendChild(extensions)
                }
                metadata.setFromTree('javax_imageio_gif_image_1.0', tree)
                writer.writeToSequence(new javax.imageio.IIOImage(frame, null, metadata), null)
            }
            writer.endWriteSequence()
        } finally {
            writer.dispose()
            output.close()
        }
        // Runtime status overlays use the exact same token colours as the image.
        def hex = { java.awt.Color value -> String.format('#%06x', value.getRGB() & 0xffffff) }
        def palette = generatedSplashResources.get().file('images/startup-splash.properties').asFile
        palette.setText("-sl-chrome=${hex(color('-sl-chrome'))}\n-sl-chrome-text=${hex(color('-sl-chrome-text'))}\n", 'UTF-8')
    }
}
processResources.dependsOn generateStartupSplash
sourceSets.main.resources.srcDir(generatedSplashResources)

jar {
    manifest { attributes 'SplashScreen-Image': 'images/startup-splash.gif' }
}

test {
    useJUnitPlatform()
    // The UI test suite builds many JavaFX scenes/stages; give the test JVM headroom.
    maxHeapSize = '2g'
    // Keep tests hermetic: never hit the real update endpoint.
    systemProperty 'seeloggyplus.disableUpdateCheck', 'true'
    // Isolate test data (DB, keystore, recent files) from the developer's real .data
    systemProperty 'seeloggyplus.dataDir', "${buildDir}/test-data"
    systemProperty 'seeloggyplus.launcherProperties', "${buildDir}/test-data/launcher.properties"
    doFirst {
        delete file("${buildDir}/test-data")
    }

    // Headless JavaFX (Monocle) for CI runners without a display.
    // Always headless, including local runs.
    systemProperty 'testfx.robot', 'glass'
    systemProperty 'testfx.headless', 'true'
    systemProperty 'glass.platform', 'Monocle'
    systemProperty 'monocle.platform', 'Headless'
    systemProperty 'prism.order', 'sw'
    systemProperty 'prism.text', 't2k'
    systemProperty 'java.awt.headless', 'true'

    finalizedBy 'testSummary'
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

application {
    mainClass = 'com.seeloggyplus.app.Main'
    applicationName = 'SeeloggyPlus'
}

tasks.register('runDev', JavaExec) {
    group = 'application'
    description = 'Runs the SeeLoggyPlus JavaFX Desktop app in Development mode with Hot Reload enabled'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.seeloggyplus.app.Launcher'
    systemProperty 'seeloggyplus.dev', 'true'
    dependsOn generateStartupSplash
    jvmArgs "-splash:${generatedSplashResources.get().file('images/startup-splash.gif').asFile.absolutePath}"
    // Optional local update simulation:
    //   ./gradlew runDev -PupdateManifestUrl=http://localhost:8000/update-manifest.json
    if (project.hasProperty('updateManifestUrl')) {
        systemProperty 'seeloggyplus.updateManifestUrl', project.property('updateManifestUrl')
    }
    if (project.hasProperty('updateChannel')) {
        systemProperty 'seeloggyplus.updateChannel', project.property('updateChannel')
    }
    if (project.hasProperty('installRoot')) {
        systemProperty 'seeloggyplus.installRoot', project.property('installRoot')
    }
}

tasks.register('fatJar', Jar) {
    dependsOn processResources
    archiveClassifier = 'all'
    archiveFileName = "seeloggyplus-all.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': 'com.seeloggyplus.app.Launcher',
                          'SplashScreen-Image': 'images/startup-splash.gif' }
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}

def detectedPlatform = {
    def os = org.gradle.internal.os.OperatingSystem.current()
    if (os.isWindows()) return 'win'
    if (os.isMacOsX()) return 'mac'
    return 'linux'
}
def buildPlatform = (project.findProperty('platform') ?: detectedPlatform()).toString()
def assetPlatform = buildPlatform == 'win' ? 'windows' : (buildPlatform == 'linux' ? 'linux' : buildPlatform)

tasks.register('packagePortableNoJre', Zip) {
    group = 'distribution'
    description = 'Create platform portable zip without bundled JRE'

    dependsOn 'fatJar'

    archiveFileName = "seeloggyplus-Portable-${buildPlatform}.zip"
    destinationDirectory = file("${buildDir}/distributions")

    into("${project.name}") {
        from(tasks.fatJar.archiveFile) {
            rename { "${project.name}.jar" }
        }
        from('launcher.bat')
        // SeeLoggyPlus.vbs is intentionally NOT packaged: older installers reject
        // unknown package entries. The app recreates it on startup (SilentLauncherInstaller).
        from('launcher.sh')
        from('launcher.properties')
        from('LAUNCHER_README.md')
        from('help') {
            into('help')
        }
    }
}

tasks.register('packagePortableWithJre', Zip) {
    group = 'distribution'
    description = 'Create platform portable zip with bundled JRE (must run on the target OS)'

    dependsOn 'fatJar', 'createCustomJre'

    archiveFileName = "seeloggyplus-Portable-${buildPlatform}-jre.zip"
    destinationDirectory = file("${buildDir}/distributions")

    into("${project.name}") {
        from("${buildDir}/custom-jre") {
            into('jre')
        }
        from(tasks.fatJar.archiveFile) {
            rename { "${project.name}.jar" }
        }
        from('launcher.bat')
        // SeeLoggyPlus.vbs is intentionally NOT packaged (see packagePortableNoJre).
        from('launcher.sh')
        from('launcher.properties')
        from('LAUNCHER_README.md')
        from('help') {
            into('help')
        }
    }
}

tasks.register('packagePlatform') {
    group = 'distribution'
    description = 'Build both portable zips (with and without JRE) for the current platform'
    dependsOn 'packagePortableNoJre', 'packagePortableWithJre'
}

// ---------------------------------------------------------------------------
// Update artifacts: per-platform manifest (merged later across platforms)
// ---------------------------------------------------------------------------
tasks.register('generatePlatformManifest', JavaExec) {
    group = 'distribution'
    description = 'Generate update-manifest-<platform>.json listing both platform assets'

    dependsOn 'packagePlatform'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.seeloggyplus.features.update.infrastructure.ManifestGeneratorCli'

    doFirst {
        def noJre = file("${buildDir}/distributions/seeloggyplus-Portable-${buildPlatform}.zip")
        def withJre = file("${buildDir}/distributions/seeloggyplus-Portable-${buildPlatform}-jre.zip")
        def baseUrl = (project.findProperty('updateBaseUrl')
                ?: "https://github.com/ariefmahendra/seeloggyplus/releases/download/${project.version}").toString()
        def channel = (project.findProperty('updateChannel') ?: 'stable').toString()
        def minSupported = (project.findProperty('minSupported') ?: '').toString()
        def notesUrl = (project.findProperty('releaseNotesUrl') ?: '').toString()
        def out = file("${buildDir}/distributions/update-manifest-${assetPlatform}.json")

        def cliArgs = ['--version', project.version.toString(),
                       '--channel', channel,
                       '--base-url', baseUrl,
                       '--asset', "${assetPlatform}-nojre=${noJre.absolutePath}",
                       '--asset', "${assetPlatform}-jre=${withJre.absolutePath}",
                       '--out', out.absolutePath]
        if (minSupported) {
            cliArgs.addAll(['--min', minSupported])
        }
        if (notesUrl) {
            cliArgs.addAll(['--notes', notesUrl])
        }
        args = cliArgs
    }
}

tasks.register('mergeManifests', JavaExec) {
    group = 'distribution'
    description = 'Merge per-platform manifests into a single update-manifest.json'

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.seeloggyplus.features.update.infrastructure.ManifestMergeCli'

    doFirst {
        def inputs = fileTree("${buildDir}/distributions") {
            include 'update-manifest-*.json'
        }.files
        def out = file("${buildDir}/distributions/update-manifest.json")
        def cliArgs = ['--out', out.absolutePath]
        inputs.each { cliArgs.addAll(['--in', it.absolutePath]) }
        args = cliArgs
    }
}

tasks.register('buildUpdateArtifacts') {
    group = 'distribution'
    description = 'Build platform zips and the per-platform update manifest'
    dependsOn 'generatePlatformManifest'
}

// ---------------------------------------------------------------------------
// Custom JRE creation using jlink (without JavaFX modules — they're in the fat JAR)
// ---------------------------------------------------------------------------
tasks.register('createCustomJre', Exec) {
    group = 'distribution'
    description = 'Create a minimal custom JRE using jlink'

    def jreOutput = file("${buildDir}/custom-jre")
    def jlinkModules = [
            'java.desktop', 'java.logging', 'java.naming', 'java.sql', 'java.xml',
            'java.net.http',
            'jdk.unsupported', 'java.scripting', 'java.management',
            'jdk.crypto.ec', 'jdk.crypto.cryptoki',
            'jdk.accessibility'
    ].join(',')

    outputs.dir(jreOutput)

    doFirst {
        // Clean previous output so jlink doesn't fail on existing directory
        delete jreOutput
    }

    // Resolve the jlink executable from the Java 21 toolchain
    def javaToolchainService = project.extensions.getByType(JavaToolchainService)
    def launcher = javaToolchainService.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }

    doFirst {
        def javaHome = launcher.get().metadata.installationPath.asFile.absolutePath
        def jlinkExe = org.gradle.internal.os.OperatingSystem.current().isWindows()
                ? "${javaHome}/bin/jlink.exe"
                : "${javaHome}/bin/jlink"

        commandLine jlinkExe,
                '--add-modules', jlinkModules,
                '--strip-debug',
                '--compress', '2',
                '--no-header-files',
                '--no-man-pages',
                '--output', jreOutput.absolutePath
    }
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}
tasks.register('testSummary') {
    doLast {
        def totals = [tests: 0, failures: 0, errors: 0, skipped: 0]
        def failedTests = []
        fileTree("${buildDir}/test-results/test").matching { include 'TEST-*.xml' }.each { f ->
            def xml = new XmlSlurper().parse(f)
            totals.keySet().each { key -> totals[key] = totals[key] + Integer.parseInt(xml.attributes()[key]?.toString() ?: '0') }
            xml.testcase.each { tc ->
                def problem = tc.failure.size() > 0 ? tc.failure[0] : (tc.error.size() > 0 ? tc.error[0] : null)
                if (problem != null) {
                    def message = problem.@message.text().replaceAll('\\s+', ' ')
                    if (message.length() > 140) {
                        message = message.substring(0, 140) + '...'
                    }
                    failedTests << "  - ${tc.@classname.text()}.${tc.@name.text()}: ${message}"
                }
            }
        }
        def failed = totals.failures + totals.errors
        println "==================== TEST SUMMARY ===================="
        println "  Total   : ${totals.tests}"
        println "  Passed  : ${totals.tests - failed - totals.skipped}"
        println "  Failed  : ${failed}"
        println "  Skipped : ${totals.skipped}"
        println "  Result  : ${failed == 0 && totals.tests > 0 ? 'PASS' : 'FAIL'}"
        println "======================================================"
        if (!failedTests.isEmpty()) {
            println "FAILED TESTS:"
            failedTests.each { println it }
        }
    }
}
