name: Recover release publication

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable tag with a complete draft release
        required: true
        type: string
      source_run_id:
        description: Tag release run whose tests and both package jobs passed
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: [self-hosted, Linux, X64, PIKACU]
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ inputs.release_tag }}
      SOURCE_RUN: ${{ inputs.source_run_id }}
    steps:
      - name: Checkout recovery tools and release metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify recovery tools and tested tag source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/test_release_publication.py
          python3 scripts/test_release_recovery.py
          python3 scripts/verify_release_recovery.py "$RELEASE_VERSION" "$SOURCE_RUN"

      - name: Prepare Linux fonts
        run: python3 scripts/setup_ci_fonts.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download verified platform artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}
          pattern: update-*
          merge-multiple: true
          path: build/distributions

      - name: Merge and verify complete manifest
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon mergeManifests
          python3 scripts/verify_release.py "$RELEASE_VERSION" --distributions build/distributions

      - name: Publish existing verified draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release_publication.py publish "$RELEASE_VERSION"

      - name: Stage manifest for GitHub Pages
        run: |
          mkdir -p public
          cp build/distributions/update-manifest.json public/

      - name: Publish manifest to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          publish_branch: gh-pages
          keep_files: true
