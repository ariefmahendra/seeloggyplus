name: Release

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Default: any self-hosted runner. To target a specific one, set the repo variable
    # RUNNER_LABELS = ["self-hosted","PICONOS"] (Settings -> Secrets and variables -> Actions -> Variables).
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Check virtual display (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            echo "ERROR: xvfb-run is not installed on this runner."
            echo "Install it once on the runner machine (as admin), then re-run:"
            echo "  Debian/Ubuntu : sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0"
            echo "  CentOS/RHEL   : sudo yum install -y xorg-x11-server-Xvfb gtk3 libXtst mesa-libGL dejavu-sans-fonts"
            echo "                  (or 'sudo dnf install -y ...' on CentOS 8/Stream)"
            exit 1
          fi

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1440x900x24" ./gradlew test --stacktrace

      - name: Run tests (non-Linux)
        if: runner.os != 'Linux'
        run: ./gradlew test --stacktrace

      - name: Show failing tests
        if: failure()
        shell: bash
        run: |
          for f in build/test-results/test/*.xml; do
            if grep -q "<failure" "$f"; then
              echo "===== $f ====="
              grep -B 2 -A 40 "<failure" "$f" | head -n 120
            fi
          done

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            build/reports/tests/test
            build/test-results/test

      - name: Build update artifacts
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ./gradlew buildUpdateArtifacts \
            -PupdateAssetUrl="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/seeloggyplus-Portable.zip" \
            -PminSupported="${{ vars.MIN_SUPPORTED }}" \
            -PreleaseNotesUrl="https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/distributions/seeloggyplus-Portable.zip
            build/distributions/update-manifest.json
          generate_release_notes: true

      - name: Stage manifest for GitHub Pages
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p public
          cp build/distributions/update-manifest.json public/

      - name: Publish manifest to gh-pages
        if: startsWith(github.ref, 'refs/tags/')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          publish_branch: gh-pages
          keep_files: true
