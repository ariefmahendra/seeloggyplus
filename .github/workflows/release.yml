name: Release

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","Linux","X64","PIKACU"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select Python runtime
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then PYTHON=python; else PYTHON=python3; fi
          "$PYTHON" --version
          "$PYTHON" -c "import sys; assert sys.version_info >= (3, 8), 'Python 3.8 or newer is required'"
          echo "PYTHON=$PYTHON" >> "$GITHUB_ENV"

      - name: Prepare Linux fonts
        if: runner.os == 'Linux'
        shell: bash
        run: '"$PYTHON" scripts/setup_ci_fonts.py'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Validate release metadata
        shell: bash
        run: |
          "$PYTHON" scripts/test_verify_release.py
          "$PYTHON" scripts/test_release_publication.py
          "$PYTHON" scripts/test_ci_fonts.py
          VERSION=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VERSION="$GITHUB_REF_NAME"; fi
          "$PYTHON" scripts/verify_release.py "$VERSION"

      - name: Verify JavaFX native startup (Linux, headless Monocle)
        if: runner.os == 'Linux'
        run: ./gradlew --no-daemon test --tests "com.seeloggyplus.app.AboutDialogContactTest" --tests "com.seeloggyplus.shared.ui.ThemedAlertsTest" --stacktrace -PheadlessTest

      - name: Run tests (Linux, headless Monocle)
        if: runner.os == 'Linux'
        run: ./gradlew --no-daemon test --stacktrace -PheadlessTest

      - name: Run tests (non-Linux)
        if: runner.os != 'Linux'
        run: ./gradlew --no-daemon test --stacktrace

      - name: Build application
        run: ./gradlew --no-daemon build

      - name: Show failing tests
        if: failure()
        shell: bash
        run: |
          {
            echo "## Failing tests"
            echo '```'
            for f in build/test-results/test/*.xml; do
              if grep -q "<failure" "$f"; then
                echo "===== $(basename "$f") ====="
                awk '/<testcase /{name=$0} /<failure/{print name}' "$f"
                grep -A 12 "<failure" "$f" | head -n 40
              fi
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            build/reports/tests/test
            build/test-results/test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: '["self-hosted","Linux","X64","PIKACU"]'
          - platform: win
            runner: '["windows-latest"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select Python runtime
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then PYTHON=python; else PYTHON=python3; fi
          "$PYTHON" --version
          "$PYTHON" -c "import sys; assert sys.version_info >= (3, 8), 'Python 3.8 or newer is required'"
          echo "PYTHON=$PYTHON" >> "$GITHUB_ENV"

      - name: Prepare Linux fonts
        if: runner.os == 'Linux'
        shell: bash
        run: '"$PYTHON" scripts/setup_ci_fonts.py'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build platform packages and manifest
        shell: bash
        run: |
          ./gradlew --no-daemon packagePlatform generatePlatformManifest \
            -Pplatform=${{ matrix.platform }} \
            -PupdateBaseUrl="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name || github.run_id }}" \
            -PminSupported="${{ vars.MIN_SUPPORTED }}" \
            -PreleaseNotesUrl="https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"

      - name: Verify real packages with the released 0.7.0 updater
        shell: bash
        run: |
          mkdir -p build/release-compatibility
          curl --fail --location --retry 3 "https://github.com/${{ github.repository }}/releases/download/0.7.0/seeloggyplus-Portable-${{ matrix.platform }}.zip" --output build/release-compatibility/legacy.zip
          "$PYTHON" -c "import zipfile; z=zipfile.ZipFile('build/release-compatibility/legacy.zip'); open('build/release-compatibility/seeloggyplus.jar','wb').write(z.read('seeloggyplus/seeloggyplus.jar'))"
          ./gradlew --no-daemon verifyReleaseCompatibility -Pplatform=${{ matrix.platform }} -PlegacyJar=build/release-compatibility/seeloggyplus.jar

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: update-${{ matrix.platform }}
          path: |
            build/distributions/seeloggyplus-Portable-${{ matrix.platform }}.zip
            build/distributions/seeloggyplus-Portable-${{ matrix.platform }}-jre.zip
            build/distributions/update-manifest-*.json

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","Linux","X64","PIKACU"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select Python runtime
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then PYTHON=python; else PYTHON=python3; fi
          "$PYTHON" --version
          "$PYTHON" -c "import sys; assert sys.version_info >= (3, 8), 'Python 3.8 or newer is required'"
          echo "PYTHON=$PYTHON" >> "$GITHUB_ENV"

      - name: Prepare Linux fonts
        if: runner.os == 'Linux'
        shell: bash
        run: '"$PYTHON" scripts/setup_ci_fonts.py'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: update-*
          merge-multiple: true
          path: build/distributions

      - name: Merge manifests
        run: ./gradlew --no-daemon mergeManifests

      - name: Validate complete release manifest
        shell: bash
        run: '"$PYTHON" scripts/verify_release.py ${{ github.ref_name }} --distributions build/distributions'

      - name: Show merged manifest
        shell: bash
        run: cat build/distributions/update-manifest.json

      - name: Build release notes (standard docs/release-notes file)
        shell: bash
        run: |
          set -e
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          NOTES="docs/release-notes/${VERSION}.md"
          if [ -f "$NOTES" ]; then
            echo "Using the standard release notes document: $NOTES"
            cp "$NOTES" release-body.md
          else
            echo "::warning::$NOTES is missing; falling back to the CHANGELOG section"
            awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" {flag=1; next}
              flag && /^## \[/ {exit}
              flag {print}
            ' CHANGELOG.md > release-body.md
          fi
          if [ ! -s release-body.md ]; then
            {
              echo "# SeeLoggyPlus ${VERSION}"
              echo ""
              echo "See CHANGELOG.md for details."
            } > release-body.md
          fi
          echo "----- release-body.md -----"
          cat release-body.md

      - name: Guard published releases
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: '"$PYTHON" scripts/release_publication.py prepare ${{ github.ref_name }}'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          fail_on_unmatched_files: true
          prerelease: false
          draft: true
          files: |
            build/distributions/seeloggyplus-Portable-linux.zip
            build/distributions/seeloggyplus-Portable-linux-jre.zip
            build/distributions/seeloggyplus-Portable-win.zip
            build/distributions/seeloggyplus-Portable-win-jre.zip
            build/distributions/update-manifest.json

      - name: Publish complete stable release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: '"$PYTHON" scripts/release_publication.py publish ${{ github.ref_name }}'

      - name: Stage manifest for GitHub Pages
        shell: bash
        run: |
          mkdir -p public
          cp build/distributions/update-manifest.json public/

      - name: Publish manifest to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          publish_branch: gh-pages
          keep_files: true
