name: Release

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    # Self-hosted runner (PICONOS). Override with repo variable RUNNER_LABELS if needed.
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Run tests (Linux, headless Monocle)
        if: runner.os == 'Linux'
        run: ./gradlew test --stacktrace -PheadlessTest

      - name: Run tests (non-Linux)
        if: runner.os != 'Linux'
        run: ./gradlew test --stacktrace

      - name: Show failing tests
        if: failure()
        shell: bash
        run: |
          for f in build/test-results/test/*.xml; do
            if grep -q "<failure" "$f"; then
              echo "===== $f ====="
              grep -B 2 -A 40 "<failure" "$f" | head -n 120
            fi
          done

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            build/reports/tests/test
            build/test-results/test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: '["self-hosted"]'
          - platform: win
            runner: '["windows-latest"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build platform packages and manifest
        shell: bash
        run: |
          ./gradlew packagePlatform generatePlatformManifest \
            -Pplatform=${{ matrix.platform }} \
            -PupdateBaseUrl="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name || github.run_id }}" \
            -PminSupported="${{ vars.MIN_SUPPORTED }}" \
            -PreleaseNotesUrl="https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: update-${{ matrix.platform }}
          path: |
            build/distributions/seeloggyplus-Portable-${{ matrix.platform }}.zip
            build/distributions/seeloggyplus-Portable-${{ matrix.platform }}-jre.zip
            build/distributions/update-manifest-*.json

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: update-*
          merge-multiple: true
          path: build/distributions

      - name: Merge manifests
        run: ./gradlew mergeManifests

      - name: Show merged manifest
        shell: bash
        run: cat build/distributions/update-manifest.json

      - name: Build release notes from CHANGELOG
        shell: bash
        run: |
          set -e
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            {
              echo "Release ${VERSION}"
              echo ""
              echo "See CHANGELOG.md for details."
            } > release-body.md
          fi
          echo "----- release-body.md -----"
          cat release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          files: |
            build/distributions/seeloggyplus-Portable-linux.zip
            build/distributions/seeloggyplus-Portable-linux-jre.zip
            build/distributions/seeloggyplus-Portable-win.zip
            build/distributions/seeloggyplus-Portable-win-jre.zip
            build/distributions/update-manifest.json

      - name: Stage manifest for GitHub Pages
        shell: bash
        run: |
          mkdir -p public
          cp build/distributions/update-manifest.json public/

      - name: Publish manifest to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          publish_branch: gh-pages
          keep_files: true
